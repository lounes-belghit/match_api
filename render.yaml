services:
  - type: web
    name: match-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./deploy/Containerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: match-api-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: match-api-cache
          property: connectionString
      - key: BIND_ADDR
        value: 0.0.0.0:10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://match-api-ijpd.onrender.com,https://match-api.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: REGISTRATIONS_ENABLED
        value: "true"
      - key: RUST_LOG
        value: info
      - key: DEFAULT_QUOTA
        value: "10000"
      - key: RATE_PER_MIN
        value: "60"
      - key: CACHE_TTL_SECS
        value: "60"
      - key: STALE_AFTER_SECS
        value: "900"
      - key: INGEST_ALERT_AFTER_SECS
        value: "3600"
      - key: DB_MAX_CONNECTIONS
        value: "10"
      - key: DB_ACQUIRE_TIMEOUT_SECS
        value: "10"
      - key: SOURCE_TIMEOUT_SECS
        value: "30"
      - key: INGEST_CONCURRENCY
        value: "3"
      - key: INGEST_MAX_RETRIES
        value: "3"
      - key: INGEST_RETRY_BASE_MS
        value: "500"

  - type: keyvalue
    name: match-api-cache
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: match-api-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    databaseName: match_api
    user: match_api
